ktor {
    application {
        modules = [ com.delivery.ApplicationKt.module ]
    }
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    database {
        url = ${?JDBC_URL}
        driver = "org.postgresql.Driver"
        user = ${?DB_USER}
        password = ${?DB_PASSWORD}
        maxPoolSize = 10
    }
    jwt {
        secret = ${?JWT_SECRET}
        issuer = ${?JWT_ISSUER}
        realm = ${?JWT_REALM}
    }
}