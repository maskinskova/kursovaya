ktor {
    application {
        modules = [ com.delivery.ApplicationKt.module ]
    }
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    database {
        url = "jdbc:postgresql://localhost:5432/delivery"
        url = ${?JDBC_URL}
        driver = "org.postgresql.Driver"
        driver = ${?DB_DRIVER}
        user = "postgres"
        user = ${?DB_USER}
        password = "123456"
        password = ${?DB_PASSWORD}
        maxPoolSize = "10"
        maxPoolSize = ${?DB_MAX_POOL_SIZE}
    }
    jwt {
        secret = "my-secret-key-change-me-in-production"
        secret = ${?JWT_SECRET}
        issuer = "ktor-delivery"
        issuer = ${?JWT_ISSUER}
        realm = "ktor-delivery"
        realm = ${?JWT_REALM}
    }
}